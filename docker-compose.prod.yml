# =============================================================================
# docker-compose.prod.yml — Production deployment for yarr-mcp
# =============================================================================

services:
  yarr-mcp:
    extends:
      file: docker-compose.common.yml
      service: yarr-mcp
    # Production must name an immutable manifest digest. Example:
    # ghcr.io/dinglebear-ai/yarr@sha256:0123... (record it before every deployment).
    image: ${YARR_MCP_IMAGE:?Set YARR_MCP_IMAGE to an immutable ghcr.io/dinglebear-ai/yarr@sha256 digest}
    pull_policy: always

networks:
  mcp:
    name: ${DOCKER_NETWORK:-mcp}
    external: true
