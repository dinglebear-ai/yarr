# =============================================================================
# .github/workflows/ci.yml — Continuous Integration
#
# This workflow runs on every push and PR to main.
# Jobs: fmt, clippy (incl. docs), test (nextest), toml, contract checks, deny
#
# All jobs must pass before merging. Adjust the matrix rust-version to match
# your Cargo.toml `rust-version` field.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: false
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  # -- actionlint: GitHub Actions workflow syntax and shell checks -------------
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Checksum-verified prebuilt release binary instead of compiling
      # actionlint from Go source on a billed runner every run.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  # ── fmt: cargo fmt --check ──────────────────────────────────────────────────
  # Hosted runner on purpose: cargo fmt never invokes rustc, so kache and the
  # self-hosted rust pool buy nothing here.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Fails when Cargo.toml, package.json, server.json and friends disagree
      # on the version. Previously reachable only by hand, which is how a
      # sibling repo sat seven releases out of sync unnoticed.
      - name: Check version sync
        run: bash scripts/check-version-sync.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ── clippy + docs: zero warnings (shared dep graph, one workspace compile) ───
  clippy:
    name: Clippy
    runs-on: ci-pool-rust
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          components: clippy

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      # Folded from the former standalone Docs job: rustdoc shares clippy's
      # dependency graph, so running it here halves a workspace compile.
      - name: cargo doc (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  # ── test: cargo nextest run --profile ci ─────────────────────────────────────
  test:
    name: Test
    runs-on: ci-pool-rust
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Install cargo-nextest
        uses: taiki-e/install-action@95cc2373c3f00275e315c306e56fef1c7a8854c0 # cargo-nextest

      # Self-hosted runners persist ~/.cargo. A run-scoped CARGO_HOME used to
      # guard against an interrupted clone of the pinned labby git dependency
      # poisoning later runs, but it forced a full registry re-download every
      # run. Surgically drop only the labby git checkout/db instead; cargo
      # re-fetches just that dependency.
      - name: Prune labby git dependency from persistent CARGO_HOME
        run: |
          rm -rf "${CARGO_HOME:-$HOME/.cargo}/git/checkouts/"*labby* || true
          rm -rf "${CARGO_HOME:-$HOME/.cargo}/git/db/"*labby* || true

      - name: cargo nextest run --profile ci
        env:
          # Use the system Git client for the pinned LABBY dep.
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo nextest run --profile ci

  # ── npm: package launcher checks ────────────────────────────────────────────
  npm:
    name: NPM Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: npm test
        run: npm test --prefix packages/yarr-mcp

      - name: npm run check
        run: npm run check --prefix packages/yarr-mcp

      - name: Plugin manifest launcher pins are in sync
        run: node scripts/sync-plugin-manifests.js --check

      - name: npm pack dry run
        run: npm pack --dry-run --json ./packages/yarr-mcp

  # ── toml: taplo check ─────────────────────────────────────────────────────────
  toml:
    name: TOML Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install taplo
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2
        with:
          tool: taplo-cli

      - name: taplo check
        run: taplo check

  # ── contracts: generated docs, plugin layout, coupled files ─────────────────
  template:
    name: Repo Contracts
    runs-on: ci-pool-ops
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Check PATTERNS.md contracts
        run: cargo xtask patterns

      - name: Check test sibling coverage
        run: cargo xtask check-test-siblings

      - name: Check service->skill-key map agrees across its copies
        run: cargo xtask skill-keys

      - name: Validate plugin layout
        run: bash scripts/validate-plugin-layout.sh

      - name: Check schema docs
        run: python3 scripts/check-schema-docs.py --check

      - name: Check documentation links and anchors
        run: python3 scripts/check-doc-links.py

      - name: Run feature smoke tests
        run: bash scripts/test-template-features.sh

      - name: Check blob sizes
        run: python3 scripts/check-blob-size.py --base origin/main --head HEAD

      - name: Check coupled files
        run: bash scripts/check-coupled-files.sh origin/main HEAD

      - name: ASCII hygiene
        run: bash scripts/run-ascii-check.sh

  # ── deny: dependency advisories, licenses, bans, sources ─────────────────────
  audit:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check security exception deadlines
        run: bash scripts/check-security-exceptions.sh

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

  # Temporary two-runner proof for the hosted MinIO credential path. Removed
  # after PR #119 records a remote hit on the second fresh Ubuntu runner.
  kache-hosted-canary-seed:
    name: Hosted Kache canary seed
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/audit-fixes-20260805'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust and connect hosted Kache
        uses: ./.github/actions/setup-rust-kache
        with:
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-prefix: ${{ vars.KACHE_S3_PREFIX }}
      - name: Seed a deterministic compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/kache-hosted-canary/src
          cat > .ci/kache-hosted-canary/Cargo.toml <<'TOML'
          [package]
          name = "yarr-kache-hosted-canary"
          version = "0.0.0"
          edition = "2024"
          publish = false
          TOML
          cat > .ci/kache-hosted-canary/src/main.rs <<'RS'
          fn main() {
              println!("hosted kache canary");
          }
          RS
          cargo check --manifest-path .ci/kache-hosted-canary/Cargo.toml
          sleep 5
          kache stats
          kache daemon stop

  kache-hosted-canary-hit:
    name: Hosted Kache canary remote hit
    needs: kache-hosted-canary-seed
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/audit-fixes-20260805'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust and connect hosted Kache
        uses: ./.github/actions/setup-rust-kache
        with:
          s3-access-key: ${{ secrets.KACHE_S3_ACCESS_KEY }}
          s3-secret-key: ${{ secrets.KACHE_S3_SECRET_KEY }}
          s3-endpoint: ${{ vars.KACHE_S3_ENDPOINT }}
          s3-bucket: ${{ vars.KACHE_S3_BUCKET }}
          s3-prefix: ${{ vars.KACHE_S3_PREFIX }}
      - name: Compile the same crate on a fresh runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/kache-hosted-canary/src
          cat > .ci/kache-hosted-canary/Cargo.toml <<'TOML'
          [package]
          name = "yarr-kache-hosted-canary"
          version = "0.0.0"
          edition = "2024"
          publish = false
          TOML
          cat > .ci/kache-hosted-canary/src/main.rs <<'RS'
          fn main() {
              println!("hosted kache canary");
          }
          RS
          cargo check --manifest-path .ci/kache-hosted-canary/Cargo.toml
      - name: Require a shared-remote hit
        env:
          KACHE_GATE_REQUIRE_REMOTE: "1"
          KACHE_GATE_REQUIRE_DAEMON: "1"
          KACHE_GATE_MIN_HIT_RATE: "1"
        run: bash scripts/kache-gate.sh
