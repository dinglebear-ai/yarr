# =============================================================================
# .github/workflows/ci.yml — Continuous Integration
#
# This workflow runs on every push and PR to main.
# Jobs: fmt, clippy, docs, test (nextest), toml, contract checks, deny
#
# All jobs must pass before merging. Adjust the matrix rust-version to match
# your Cargo.toml `rust-version` field.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: false
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "0"

jobs:
  # -- actionlint: GitHub Actions workflow syntax and shell checks -------------
  actionlint:
    name: Actionlint
    uses: dinglebear-ai/workflows/.github/workflows/fast-ops.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      policy-command: bash scripts/check-version-sync.sh

  rust:
    name: Fast Rust
    uses: dinglebear-ai/workflows/.github/workflows/fast-rust.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      toolchain: "1.97.1"
      check-command: cargo check --all-targets --locked
      clippy-command: cargo clippy --all-targets --locked -- -D warnings
      test-command: cargo test --workspace --locked --no-run
      kache-manifest-key: yarr-fast-rust
    secrets:
      KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
      KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}

  # ── docs: rustdoc with zero warnings (broken/ambiguous intra-doc links) ──────
  docs:
    name: Docs
    uses: dinglebear-ai/workflows/.github/workflows/rust-docs.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      toolchain: "1.97.1"
      command: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items --locked

  # ── test: cargo nextest run --profile ci ─────────────────────────────────────
  test:
    name: Test
    runs-on: [self-hosted, ci-pool-rust]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Install cargo-nextest
        uses: taiki-e/install-action@95cc2373c3f00275e315c306e56fef1c7a8854c0 # cargo-nextest

      - name: cargo nextest run --profile ci
        env:
          # Self-hosted runners persist ~/.cargo. Give nextest a run-scoped
          # dependency checkout so an interrupted Git clone cannot poison a
          # later run, and use the system Git client for the pinned LABBY dep.
          CARGO_HOME: ${{ runner.temp }}/yarr-nextest-cargo-${{ github.run_id }}-${{ github.run_attempt }}
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo nextest run --profile ci

  # ── npm: package launcher checks ────────────────────────────────────────────
  npm:
    name: NPM Package
    uses: dinglebear-ai/workflows/.github/workflows/fast-node.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      node-version: "22"
      working-directory: packages/yarr-mcp
      enable-cache: false
      install-command: ""
      audit-command: ""
      lint-command: npm run check
      typecheck-command: ""
      test-command: npm test
      contract-command: node ../../scripts/sync-plugin-manifests.js --check && npm pack --dry-run --json

  # ── toml: taplo check ─────────────────────────────────────────────────────────
  toml:
    name: TOML Format
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install taplo
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2
        with:
          tool: taplo-cli

      - name: taplo check
        run: taplo check

  # ── contracts: generated docs, plugin layout, coupled files ─────────────────
  template:
    name: Repo Contracts
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Check PATTERNS.md contracts
        run: cargo xtask patterns

      - name: Check test sibling coverage
        run: cargo xtask check-test-siblings

      - name: Check service->skill-key map agrees across its copies
        run: cargo xtask skill-keys

      - name: Validate plugin layout
        run: bash scripts/validate-plugin-layout.sh

      - name: Check schema docs
        run: python3 scripts/check-schema-docs.py --check

      - name: Check documentation links and anchors
        run: python3 scripts/check-doc-links.py

      - name: Run feature smoke tests
        run: bash scripts/test-template-features.sh

      - name: Check blob sizes
        run: python3 scripts/check-blob-size.py --base origin/main --head HEAD

      - name: Check coupled files
        run: bash scripts/check-coupled-files.sh origin/main HEAD

      - name: ASCII hygiene
        run: bash scripts/run-ascii-check.sh

  # ── deny: dependency advisories, licenses, bans, sources ─────────────────────
  audit:
    name: Cargo Deny
    uses: dinglebear-ai/workflows/.github/workflows/rust-security.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      toolchain: "1.97.1"
      command: bash scripts/check-security-exceptions.sh && cargo deny check --all-features

  fleet-policy:
    name: Fleet Policy
    uses: dinglebear-ai/workflows/.github/workflows/fleet-policy.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      release-file-regex: '(^|/)(release|docker-publish|unraid-plugin-release)\.ya?ml$'

  fleet-contract:
    name: Fleet Contract
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      profile: rust
      implementation-ref: 542ea7b7e5ca2d4e21f3277bfcf158584fee90ec

  ci-gate:
    name: CI Gate
    if: always()
    runs-on: [self-hosted, ci-pool-ops]
    timeout-minutes: 10
    needs:
      - actionlint
      - rust
      - docs
      - test
      - npm
      - toml
      - template
      - audit
      - fleet-policy
      - fleet-contract
    steps:
      - name: Require all CI lanes
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            [[ "$result" == success || "$result" == skipped ]]
          done
