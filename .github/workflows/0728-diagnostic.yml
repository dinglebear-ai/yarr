name: Temporary rustfmt diagnostics

on:
  push:
    branches: [fix/mcp-2026-07-28-alignment]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ci-pool-rust
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: Capture rustfmt patch
        shell: bash
        run: |
          cargo fmt --all
          git diff -- '*.rs' > /tmp/rustfmt.patch
          git reset --hard HEAD
          cp /tmp/rustfmt.patch CI_RUSTFMT_DIAGNOSTIC.patch
      - name: Publish evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CI_RUSTFMT_DIAGNOSTIC.patch
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): capture temporary rustfmt diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
