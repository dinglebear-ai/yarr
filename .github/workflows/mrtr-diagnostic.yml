name: Temporary MRTR diagnostics

on:
  push:
    branches: [fix/mcp-2026-07-28-alignment]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ci-pool-rust
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Capture targeted test and rustfmt evidence
        shell: bash
        run: |
          set +e
          cargo test -p yarr modern_ -- --nocapture > /tmp/yarr-mrtr-test.txt 2>&1
          test_rc=$?
          set -e

          cargo fmt --all
          git diff -- '*.rs' > /tmp/yarr-rustfmt.patch
          git reset --hard HEAD

          {
            printf 'targeted_test_exit=%s\n\n' "$test_rc"
            cat /tmp/yarr-mrtr-test.txt
          } > CI_MRTR_DIAGNOSTIC.txt
          cp /tmp/yarr-rustfmt.patch CI_RUSTFMT_DIAGNOSTIC.patch

      - name: Publish diagnostic evidence to this branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CI_MRTR_DIAGNOSTIC.txt CI_RUSTFMT_DIAGNOSTIC.patch
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): capture temporary MRTR diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
