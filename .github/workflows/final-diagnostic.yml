name: Temporary final diagnostics

on:
  push:
    branches:
      - fix/mcp-2026-07-28-alignment

permissions:
  contents: write

jobs:
  diagnose-final:
    if: github.actor != 'github-actions[bot]'
    runs-on: ci-pool-ops
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Capture npm and repo contract diagnostics
        shell: bash
        run: |
          set +e
          npm test --prefix packages/yarr-mcp > /tmp/npm-test.txt 2>&1; npm_test_rc=$?
          npm run check --prefix packages/yarr-mcp > /tmp/npm-check.txt 2>&1; npm_check_rc=$?
          node scripts/sync-plugin-manifests.js --check > /tmp/npm-sync.txt 2>&1; npm_sync_rc=$?
          npm pack --dry-run --json ./packages/yarr-mcp > /tmp/npm-pack.txt 2>&1; npm_pack_rc=$?

          cargo xtask patterns > /tmp/patterns.txt 2>&1; patterns_rc=$?
          cargo xtask check-test-siblings > /tmp/siblings.txt 2>&1; siblings_rc=$?
          cargo xtask skill-keys > /tmp/skill-keys.txt 2>&1; skill_keys_rc=$?
          bash scripts/validate-plugin-layout.sh > /tmp/plugin-layout.txt 2>&1; plugin_layout_rc=$?
          python3 scripts/check-schema-docs.py --check > /tmp/schema-docs.txt 2>&1; schema_docs_rc=$?
          python3 scripts/check-doc-links.py > /tmp/doc-links.txt 2>&1; doc_links_rc=$?
          bash scripts/test-template-features.sh > /tmp/features.txt 2>&1; features_rc=$?
          python3 scripts/check-blob-size.py --base origin/main --head HEAD > /tmp/blob-size.txt 2>&1; blob_size_rc=$?
          bash scripts/check-coupled-files.sh origin/main HEAD > /tmp/coupled.txt 2>&1; coupled_rc=$?
          bash scripts/run-ascii-check.sh > /tmp/ascii.txt 2>&1; ascii_rc=$?
          set -e

          {
            printf 'npm_test=%s npm_check=%s npm_sync=%s npm_pack=%s\n' "$npm_test_rc" "$npm_check_rc" "$npm_sync_rc" "$npm_pack_rc"
            printf 'patterns=%s siblings=%s skill_keys=%s plugin_layout=%s schema_docs=%s doc_links=%s features=%s blob_size=%s coupled=%s ascii=%s\n\n' "$patterns_rc" "$siblings_rc" "$skill_keys_rc" "$plugin_layout_rc" "$schema_docs_rc" "$doc_links_rc" "$features_rc" "$blob_size_rc" "$coupled_rc" "$ascii_rc"
            for f in npm-test npm-check npm-sync npm-pack patterns siblings skill-keys plugin-layout schema-docs doc-links features blob-size coupled ascii; do
              printf '===== %s =====\n' "$f"
              cat "/tmp/$f.txt"
              printf '\n'
            done
          } > CI_FINAL_DIAGNOSTIC.txt
      - name: Publish evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CI_FINAL_DIAGNOSTIC.txt
          git commit -m "chore(ci): capture temporary final diagnostics"
          git push origin HEAD:fix/mcp-2026-07-28-alignment
