name: MSRV

# rust-toolchain.toml pins the build toolchain to the same 1.97.1 as the MSRV
# below, so every CI job already compiles at MSRV — a per-PR MSRV leg carries
# zero extra signal. Runs on main pushes, weekly, and on demand instead.
# Revisit the triggers if the channel and MSRV ever diverge.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  msrv:
    name: Minimum Supported Rust Version
    runs-on: ci-pool-rust
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          toolchain: "1.97.1"

      - name: cargo check (MSRV)
        run: cargo check --all-targets --locked

      - name: cargo test --no-run (MSRV)
        run: cargo test --no-run --all-targets --locked
