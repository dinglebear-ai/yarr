name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 3"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze Rust
    uses: dinglebear-ai/workflows/.github/workflows/codeql.yml@66e64b9f31de7ac1f9aa8c9f87ede9bbec5eae1d
    with:
      language: rust
      build-mode: manual
      build-command: cargo build --release --locked
