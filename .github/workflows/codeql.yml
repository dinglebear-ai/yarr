name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 3"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze Rust
    uses: dinglebear-ai/workflows/.github/workflows/codeql.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      language: rust
      build-mode: manual
      build-command: cargo build --release --locked
