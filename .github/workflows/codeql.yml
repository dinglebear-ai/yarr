name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 3"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze Rust
    uses: dinglebear-ai/workflows/.github/workflows/codeql.yml@542ea7b7e5ca2d4e21f3277bfcf158584fee90ec
    with:
      language: rust
      build-mode: manual
      build-command: cargo build --release --locked
