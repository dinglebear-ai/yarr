name: Setup Rust with kache
description: Install a Rust toolchain plus a pinned kache, point it at the shared filesystem remote, start the daemon, and print cache evidence.

inputs:
  toolchain:
    description: Rust toolchain to install.
    required: false
    default: stable
  components:
    description: Comma-separated Rust components to install.
    required: false
    default: ""
  targets:
    description: Comma-separated Rust targets to install.
    required: false
    default: ""
  enable-cache:
    description: >-
      "true" (default) wires kache as RUSTC_WRAPPER and starts the daemon.
      "false" leaves cargo bare — used by the GitHub-hosted native Windows job,
      which cannot reach the shared remote.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Linux build prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        need_install=false
        command -v cc >/dev/null 2>&1 || need_install=true
        command -v pkg-config >/dev/null 2>&1 || need_install=true
        pkg-config --exists openssl 2>/dev/null || need_install=true
        pkg-config --exists dbus-1 2>/dev/null || need_install=true
        # soma-tauri-shell (crates/shared/tauri-shell) pulls in Tauri's Linux
        # desktop stack: GTK3 (tray icon/windowing), WebKitGTK (webview),
        # ayatana-appindicator (tray icon), rsvg (icon rendering), and xdotool
        # (global shortcuts).
        pkg-config --exists gtk+-3.0 2>/dev/null || need_install=true
        pkg-config --exists webkit2gtk-4.1 2>/dev/null || need_install=true
        pkg-config --exists ayatana-appindicator3-0.1 2>/dev/null || need_install=true
        pkg-config --exists librsvg-2.0 2>/dev/null || need_install=true
        pkg-config --exists xdo 2>/dev/null || need_install=true
        if [ "$need_install" = false ]; then
          exit 0
        fi
        packages="build-essential pkg-config libssl-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev"
        if command -v apt-get >/dev/null 2>&1; then
          if [ "$(id -u)" = "0" ]; then
            apt-get update
            # shellcheck disable=SC2086
            apt-get install -y $packages
          elif command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            # shellcheck disable=SC2086
            sudo apt-get install -y $packages
          else
            echo "::error::apt-get is available but the runner is not root and sudo is missing."
            exit 1
          fi
          exit 0
        fi
        echo "::error::No C compiler found and no supported package manager is available."
        exit 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # dtolnay/rust-toolchain installs requested targets on inputs.toolchain.
    # A checked-in rust-toolchain.toml can override that toolchain for cargo,
    # so also install each target on the toolchain that is actually active in
    # the checkout. Without this, cross-builds can fail with E0463 even though
    # the setup action reported that it installed the requested target.
    - name: Ensure requested targets on active project toolchain
      if: inputs.targets != ''
      shell: bash
      env:
        REQUESTED_TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        active_toolchain="$(rustup show active-toolchain | awk '{print $1}')"
        IFS=',' read -ra targets <<< "${REQUESTED_TARGETS}"
        for target in "${targets[@]}"; do
          target="${target//[[:space:]]/}"
          if [[ -n "${target}" ]]; then
            rustup target add --toolchain "${active_toolchain}" "${target}"
          fi
        done

    # Pinned exactly. The filesystem remote is new in 0.12.0 (PR #593) and is
    # SILENTLY IGNORED by 0.11.0 — it reports "Remote: not configured" with no
    # error. Floating this version would degrade the shared cache without any
    # failure signal. Bump deliberately, never via tag drift.
    - name: Install kache
      if: inputs.enable-cache == 'true' && runner.os == 'Linux'
      shell: bash
      env:
        KACHE_VERSION: "0.12.0"
      run: |
        set -euo pipefail
        # The farm image bakes an exactly-pinned kache at /usr/local/bin/kache
        # (and runs the daemon for the container lifetime). Download only when
        # the baked binary is absent or the wrong version — e.g. a runner
        # image that predates the bake, or a non-farm self-hosted box.
        if [ -x /usr/local/bin/kache ] && /usr/local/bin/kache --version | grep -q " ${KACHE_VERSION}\$"; then
          echo "kache ${KACHE_VERSION} baked into the runner image — skipping download"
          exit 0
        fi
        target=x86_64-unknown-linux-musl
        # The release's .sha256 names the ORIGINAL asset filename, so the
        # tarball must be saved under that exact name. Downloading it as
        # kache.tar.gz makes `sha256sum -c` look for a file that does not
        # exist and report a "mismatch" that is really a naming bug.
        asset="kache-${target}.tar.gz"
        url="https://github.com/kunobi-ninja/kache/releases/download/v${KACHE_VERSION}/${asset}"
        tmp="$(mktemp -d)"
        curl -fsSL --retry 3 -o "$tmp/${asset}" "$url"
        curl -fsSL --retry 3 -o "$tmp/${asset}.sha256" "${url}.sha256"
        ( cd "$tmp" && sha256sum -c "${asset}.sha256" ) \
          || { echo "::error::kache checksum verification failed for ${asset}"; exit 1; }
        tar -xzf "$tmp/${asset}" -C "$tmp"
        install -Dm755 "$(find "$tmp" -type f -name kache | head -n1)" "$HOME/.local/bin/kache"
        rm -rf "$tmp"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/kache" --version

    - name: Configure kache
      if: inputs.enable-cache == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # ONE local store per runner container at /_work/.kache — /_work is
        # this runner's PRIVATE persistent host mount, so the store survives
        # jobs and recycles without ever crossing an OS boundary (the
        # forbidden case is cross-CONTAINER sharing, not cross-repo: a single
        # store dedups every repo on this runner and is the store the
        # container-lifetime daemon serves). Fall back to the old
        # workspace-parent path only where /_work does not exist.
        if [ -d /_work ] && [ -w /_work ]; then
          cache_dir=/_work/.kache
        else
          cache_dir="$(cd "$GITHUB_WORKSPACE/.." && pwd)/.kache"
        fi
        mkdir -p "$cache_dir"

        # The REMOTE is the shared surface: one directory on tootie's raidz1
        # cache pool, bind-mounted into every runner.
        #
        # A missing mount degrades to local-only rather than failing the job:
        # runners are rolled out one image build at a time, so hard-failing here
        # would break every runner that has not been recreated yet. The
        # DEGRADATION IS NOT SILENT — it is annotated here and enforced by
        # scripts/kache-gate.sh, which fails the job when
        # KACHE_GATE_REQUIRE_REMOTE=1 and no remote hit occurred. Setup degrades;
        # the gate enforces. Do not move enforcement into this step.
        remote_dir=/home/runner/kache-remote
        mkdir -p "$HOME/.config/kache"
        # An existing config may belong to a persistent host or to the farm
        # image. Never overwrite it from a job: doing so can silently strip the
        # host's remote and daemon lifetime settings after the workflow exits.
        if [ -s "$HOME/.config/kache/config.toml" ]; then
          echo "existing kache config present - leaving it alone"
        elif [ -w "$remote_dir" ]; then
          cat > "$HOME/.config/kache/config.toml" <<TOML
        [cache]
        local_max_size = "40GiB"

        [cache.remote]
        type = "filesystem"
        path = "$remote_dir"
        prefix = "artifacts"
        TOML
          echo "kache remote: $remote_dir"
        else
          cat > "$HOME/.config/kache/config.toml" <<TOML
        [cache]
        local_max_size = "40GiB"
        TOML
          echo "::warning::shared kache remote $remote_dir is missing or not writable — running LOCAL-ONLY. This runner neither reads from nor contributes to the shared cache."
        fi

        {
          echo "RUSTC_WRAPPER=kache"
          echo "CARGO_BUILD_RUSTC_WRAPPER=kache"
          echo "KACHE_CACHE_DIR=$cache_dir"
          # Incremental compilation and a compile wrapper do not compose.
          echo "CARGO_INCREMENTAL=0"
          # Runners are long-lived. The default 600s idle exit would leave the
          # daemon dead between jobs, and the remote-check path never starts it
          # — a dead daemon means zero remote hits and zero uploads, silently.
          echo "KACHE_DAEMON_IDLE_TIMEOUT=0"
          # A full cold soma build stores well over the 2 GiB default prefetch
          # budget. Raise it so a warm runner is not truncated mid-plan.
          echo "KACHE_PREFETCH_MAX_BYTES=8GiB"
          echo "KACHE_MAX_SIZE=40GiB"
        } >> "$GITHUB_ENV"

    - name: Ensure kache daemon
      if: inputs.enable-cache == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # The farm image supervises a container-lifetime daemon (started at
        # boot, outside job process groups, so the post-job orphan reaper
        # cannot kill it and the upload queue survives job end). This step is
        # therefore normally a no-op verification; the start covers non-farm
        # runners. The daemon is the ONLY path that uploads dependency
        # artifacts and the ONLY path that performs remote lookups — and kache
        # is fail-open, so wrappers that race daemon initialization silently
        # skip the remote and compile. Wait until it answers.
        kache daemon status >/dev/null 2>&1 || kache daemon start
        for _ in $(seq 1 30); do
          kache daemon status >/dev/null 2>&1 && break
          sleep 1
        done
        kache daemon status >/dev/null 2>&1 || { echo "::error::kache daemon is not answering"; exit 1; }
        kache daemon

    - name: Print cache evidence
      if: inputs.enable-cache == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        echo "kache      $(kache --version)"
        echo "wrapper    ${RUSTC_WRAPPER:-<unset>}"
        echo "store      ${KACHE_CACHE_DIR:-<unset>}"
        kache doctor || true
        kache stats || true

    # Snapshot the cumulative counters so scripts/kache-gate.sh can diff this
    # build's contribution out of them. Required because `kache report --since`
    # does NOT bound the event window in 0.12.0 — measured on soma 2026-07-29,
    # `--since 1m` and `--since 24h` returned counts differing by 2 out of
    # 6,656, and a 1-minute query reported a 32-minute timeline. Without a
    # baseline, `errors > 0` would go permanently red after one historical
    # store failure and `remote_hits > 0` would pass forever after one hit.
    - name: Baseline kache counters for the gate
      if: inputs.enable-cache == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        echo "KACHE_GATE_BASELINE=${RUNNER_TEMP}/kache-gate-baseline.json" >> "$GITHUB_ENV"
        KACHE_GATE_BASELINE="${RUNNER_TEMP}/kache-gate-baseline.json" \
        KACHE_GATE_ROOT="$GITHUB_WORKSPACE" \
          "$GITHUB_WORKSPACE/scripts/kache-gate.sh" --baseline
