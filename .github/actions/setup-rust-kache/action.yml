name: Setup Rust with kache
description: Install a Rust toolchain plus a pinned kache, connect it to the shared MinIO remote, start the daemon, and print cache evidence.

inputs:
  toolchain:
    description: Rust toolchain to install.
    required: false
    default: stable
  components:
    description: Comma-separated Rust components to install.
    required: false
    default: ""
  targets:
    description: Comma-separated Rust targets to install.
    required: false
    default: ""
  enable-cache:
    description: >-
      "true" (default) wires kache as RUSTC_WRAPPER and starts the daemon.
      "false" leaves cargo bare — used by the GitHub-hosted native Windows job,
      which cannot reach the shared remote.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install Linux build prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        need_install=false
        command -v cc >/dev/null 2>&1 || need_install=true
        command -v pkg-config >/dev/null 2>&1 || need_install=true
        pkg-config --exists openssl 2>/dev/null || need_install=true
        pkg-config --exists dbus-1 2>/dev/null || need_install=true
        # soma-tauri-shell (crates/shared/tauri-shell) pulls in Tauri's Linux
        # desktop stack: GTK3 (tray icon/windowing), WebKitGTK (webview),
        # ayatana-appindicator (tray icon), rsvg (icon rendering), and xdotool
        # (global shortcuts).
        pkg-config --exists gtk+-3.0 2>/dev/null || need_install=true
        pkg-config --exists webkit2gtk-4.1 2>/dev/null || need_install=true
        pkg-config --exists ayatana-appindicator3-0.1 2>/dev/null || need_install=true
        pkg-config --exists librsvg-2.0 2>/dev/null || need_install=true
        pkg-config --exists xdo 2>/dev/null || need_install=true
        if [ "$need_install" = false ]; then
          exit 0
        fi
        packages="build-essential pkg-config libssl-dev libdbus-1-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev"
        if command -v apt-get >/dev/null 2>&1; then
          if [ "$(id -u)" = "0" ]; then
            apt-get update
            # shellcheck disable=SC2086
            apt-get install -y $packages
          elif command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            # shellcheck disable=SC2086
            sudo apt-get install -y $packages
          else
            echo "::error::apt-get is available but the runner is not root and sudo is missing."
            exit 1
          fi
          exit 0
        fi
        echo "::error::No C compiler found and no supported package manager is available."
        exit 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # dtolnay/rust-toolchain installs requested targets on inputs.toolchain.
    # A checked-in rust-toolchain.toml can override that toolchain for cargo,
    # so also install each target on the toolchain that is actually active in
    # the checkout. Without this, cross-builds can fail with E0463 even though
    # the setup action reported that it installed the requested target.
    - name: Ensure requested targets on active project toolchain
      if: inputs.targets != ''
      shell: bash
      env:
        REQUESTED_TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        active_toolchain="$(rustup show active-toolchain | awk '{print $1}')"
        IFS=',' read -ra targets <<< "${REQUESTED_TARGETS}"
        for target in "${targets[@]}"; do
          target="${target//[[:space:]]/}"
          if [[ -n "${target}" ]]; then
            rustup target add --toolchain "${active_toolchain}" "${target}"
          fi
        done

    # Pinned exactly. The private fleet and hosted CI share the 0.12.0 S3
    # object layout and daemon protocol. Floating this version could split cache
    # epochs or layouts without an obvious workflow failure. Bump deliberately,
    # never via tag drift.
    - name: Install kache
      if: inputs.enable-cache == 'true' && runner.os == 'Linux'
      shell: bash
      env:
        KACHE_VERSION: "0.12.0"
      run: |
        set -euo pipefail
        # Reuse any already-installed binary at the pinned version. Persistent
        # hosts may manage kache through mise/systemd; reinstalling the same
        # bytes changes the executable mtime, which kache treats as a protocol
        # epoch and can force the managed daemon into a restart loop.
        if command -v kache >/dev/null 2>&1 && kache --version | grep -q " ${KACHE_VERSION}\$"; then
          echo "kache ${KACHE_VERSION} already available at $(command -v kache) - skipping download"
          exit 0
        fi
        target=x86_64-unknown-linux-musl
        # The release's .sha256 names the ORIGINAL asset filename, so the
        # tarball must be saved under that exact name. Downloading it as
        # kache.tar.gz makes `sha256sum -c` look for a file that does not
        # exist and report a "mismatch" that is really a naming bug.
        asset="kache-${target}.tar.gz"
        url="https://github.com/kunobi-ninja/kache/releases/download/v${KACHE_VERSION}/${asset}"
        tmp="$(mktemp -d)"
        curl -fsSL --retry 3 -o "$tmp/${asset}" "$url"
        curl -fsSL --retry 3 -o "$tmp/${asset}.sha256" "${url}.sha256"
        ( cd "$tmp" && sha256sum -c "${asset}.sha256" ) \
          || { echo "::error::kache checksum verification failed for ${asset}"; exit 1; }
        tar -xzf "$tmp/${asset}" -C "$tmp"
        install -Dm755 "$(find "$tmp" -type f -name kache | head -n1)" "$HOME/.local/bin/kache"
        rm -rf "$tmp"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/kache" --version

    - name: Configure kache
      if: inputs.enable-cache == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        config_file="$HOME/.config/kache/config.toml"
        credentials_file="$HOME/.aws/credentials"
        mkdir -p "$HOME/.config/kache"

        # Persistent hosts own their default store through systemd. Farm
        # containers use their private /_work bind mount. Other ephemeral
        # runners keep a job-adjacent store that survives steps in the job.
        if command -v systemctl >/dev/null 2>&1 &&
           systemctl --user cat kache.service >/dev/null 2>&1; then
          cache_dir="$HOME/.cache/kache"
        elif [ -d /_work ] && [ -w /_work ]; then
          cache_dir=/_work/.kache
        else
          cache_dir="$(cd "$GITHUB_WORKSPACE/.." && pwd)/.kache"
        fi

        # An existing config may belong to a persistent host or to the farm
        # image. Never overwrite it from a job: doing so can silently strip the
        # host's remote and daemon lifetime settings after the workflow exits.
        if [ -s "$config_file" ]; then
          echo "existing kache config present - leaving it alone"
          configured_store="$(
            sed -n 's/^[[:space:]]*local_store[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              "$config_file" | head -n1
          )"
          [ -z "$configured_store" ] || cache_dir="$configured_store"
        elif [ -r "$credentials_file" ] &&
             grep -Eq '^[[:space:]]*\[kache\][[:space:]]*$' "$credentials_file"; then
          cat > "$config_file" <<TOML
        [cache]
        local_store = "$cache_dir"
        daemon_idle_timeout_secs = 0
        prefetch_max_bytes = "8GiB"
        local_max_size = "40GiB"

        [cache.remote]
        type = "s3"
        bucket = "kache"
        endpoint = "http://10.1.0.2:9000"
        region = "us-east-1"
        prefix = "rust"
        profile = "kache"
        TOML
          echo "kache remote: s3://kache/rust via Tootie MinIO"
        else
          cat > "$config_file" <<TOML
        [cache]
        local_store = "$cache_dir"
        daemon_idle_timeout_secs = 0
        prefetch_max_bytes = "8GiB"
        local_max_size = "40GiB"
        TOML
          echo "::warning::AWS profile 'kache' is unavailable - running LOCAL-ONLY. This runner neither reads from nor contributes to the shared cache."
        fi
        mkdir -p "$cache_dir"

        {
          echo "RUSTC_WRAPPER=kache"
          echo "CARGO_BUILD_RUSTC_WRAPPER=kache"
          echo "KACHE_CACHE_DIR=$cache_dir"
          # Incremental compilation and a compile wrapper do not compose.
          echo "CARGO_INCREMENTAL=0"
          # Capacity and daemon policy live in the preserved or generated TOML.
          # Do not override a persistent host's larger L1 through GITHUB_ENV.
        } >> "$GITHUB_ENV"

    - name: Ensure kache daemon
      if: inputs.enable-cache == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        daemon_is_running() {
          local status
          status="$(kache daemon status 2>&1)"
          grep -q "Daemon:" <<< "$status" && ! grep -q "not running" <<< "$status"
        }

        # Persistent hosts own kache through a user systemd unit. Never
        # launch a detached competitor there. Farm and ephemeral runners
        # use kache daemon restart, which also clears stale daemon state.
        if command -v systemctl >/dev/null 2>&1 && systemctl --user cat kache.service >/dev/null 2>&1; then
          echo "host-managed kache.service found - using systemd"
          systemctl --user is-active --quiet kache.service || systemctl --user start kache.service
        else
          daemon_is_running || kache daemon restart
        fi

        for _ in $(seq 1 30); do
          daemon_is_running && break
          sleep 1
        done
        daemon_is_running || { echo "::error::kache daemon is not answering"; kache daemon status; exit 1; }
        kache daemon

    - name: Print cache evidence
      if: inputs.enable-cache == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        echo "kache      $(kache --version)"
        echo "wrapper    ${RUSTC_WRAPPER:-<unset>}"
        echo "store      ${KACHE_CACHE_DIR:-<unset>}"
        kache doctor || true
        kache stats || true

    # Snapshot the cumulative counters so scripts/kache-gate.sh can diff this
    # build's contribution out of them. Required because `kache report --since`
    # does NOT bound the event window in 0.12.0 — measured on soma 2026-07-29,
    # `--since 1m` and `--since 24h` returned counts differing by 2 out of
    # 6,656, and a 1-minute query reported a 32-minute timeline. Without a
    # baseline, `errors > 0` would go permanently red after one historical
    # store failure and `remote_hits > 0` would pass forever after one hit.
    - name: Baseline kache counters for the gate
      if: inputs.enable-cache == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        echo "KACHE_GATE_BASELINE=${RUNNER_TEMP}/kache-gate-baseline.json" >> "$GITHUB_ENV"
        KACHE_GATE_BASELINE="${RUNNER_TEMP}/kache-gate-baseline.json" \
        KACHE_GATE_ROOT="$GITHUB_WORKSPACE" \
          "$GITHUB_WORKSPACE/scripts/kache-gate.sh" --baseline
