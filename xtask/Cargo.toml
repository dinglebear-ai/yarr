# =============================================================================
# xtask/Cargo.toml — Repo automation crate
#
# Invoked via: cargo xtask <command>
#
# This crate is intentionally kept dependency-light so it compiles fast even
# on a cold cache. Do NOT add heavy crates (serde, tokio, reqwest, etc.) here.
# If you need async, use std::process::Command + shell scripts instead.
#
# Keep "xtask" as the crate name — cargo's xtask convention relies on it.
# Add dependencies only if absolutely necessary.
# =============================================================================

[package]
name = "xtask"
# Literal, NOT version.workspace = true. release-please's Rust updater walks
# every workspace member and rewrites `package.version` in place; an inherited
# version has no literal value to write, so the whole run dies with
# "value at path package.version is not tagged". This crate is publish = false
# and nothing consumes its version, so a literal that release-please maintains
# is the cheapest way to keep the workspace walkable.
version = "2.2.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Exclude from crates.io — this is a private automation crate.
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
jsonschema = { version = "0.47", default-features = false }
roxmltree = "0.21"
yarr = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noyalib = { version = "0.0.15", default-features = false, features = ["std", "strict-deserialise"] }
ureq = { version = "3", default-features = false, features = ["json"] }
url = "2"
walkdir = "2"
